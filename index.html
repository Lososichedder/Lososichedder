<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо Фортуны | Лосось и Чеддер</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Russo+One&display=swap" rel="stylesheet">
<style>
body {background:#000;color:white;text-align:center;margin:0;padding:0;overflow:hidden;font-family:'Poppins',sans-serif}
h1 {margin-top:20px;font-size:60px;color:#ffcc00;animation:glow 2s infinite,blink 2s infinite;font-family:'Bebas Neue',cursive;letter-spacing:2px}
@keyframes blink{0%,50%,100%{opacity:1}25%,75%{opacity:0.7}}
@keyframes glow{0%{text-shadow:0 0 10px #ffcc00,0 0 20px #ffcc00}50%{text-shadow:0 0 20px #ffff00,0 0 40px #ffff00}100%{text-shadow:0 0 10px #ffcc00,0 0 20px #ffcc00}}
#wheel-container {margin:20px auto;width:400px;height:400px;position:relative;display:inline-block;box-shadow:0 0 60px rgba(255,255,0,0.7);border-radius:50%}
#wheel {width:100%;transition:transform 5s cubic-bezier(0.33, 1, 0.68, 1);border-radius:50%;border:10px solid white}
.pointer {position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:20px solid red}
#lever {position:absolute;top:100px;left:440px;width:20px;height:200px;background:silver;border-radius:10px}
#lever-ball {position:absolute;top:-30px;left:-15px;width:50px;height:50px;background:red;border-radius:50%;cursor:grab;transition:transform 0.2s ease}
#result {margin-top:20px;font-size:40px;color:#00ff00;font-family:'Russo One',sans-serif;text-shadow:0 0 15px #00ff00}
#instruction {margin-top:10px;font-size:26px;color:#ffcc00;text-shadow:0 0 10px #ffcc00;animation:blink 1.5s infinite;font-family:'Bebas Neue',cursive;display:none}
#message {position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);font-size:80px;color:yellow;text-shadow:3px 3px 5px black;display:none;font-family:'Russo One',cursive}
.confetti {position:fixed;width:15px;height:15px;background:yellow;opacity:.8;border-radius:50%;animation:explode 3s ease-out forwards}
@keyframes explode{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(0.5);opacity:0}}
#countdown {margin-top:10px;font-size:24px;color:#ff5555;}
</style>
</head>
<body>
<h1>КОЛЕСО ФОРТУНЫ</h1>

<audio id="leverSound" src="lever-pull.mp3"></audio>
<audio id="spinSound" src="wheel-spin.mp3"></audio>
<audio id="winSound" src="win-sound.mp3"></audio>

<div style="position:relative;display:inline-block">
<div id="wheel-container"><div class="pointer"></div><img id="wheel" src="kolyoso.png" alt="Wheel"></div>
<div id="lever"><div id="lever-ball"></div></div></div>

<div id="result"></div>
<div id="instruction">Введите этот промо в приложении и заберите приз в течении 24 часов</div>
<div id="countdown"></div>
<div id="message"></div>

<script>
const prizes=[{name:"Кола",promo:"4217"},{name:"Онигири с крабом",promo:"7351"},{name:"Сырные ломтики",promo:"1628"},{name:"Фри",promo:"9046"},{name:"Наггетсы",promo:"5832"},{name:"Маки с лососем",promo:"3174"},{name:"Запечённый мини-ролл",promo:"8462"},{name:"Пицца Маргарита",promo:"2095"},{name:"Крылья 8 шт",promo:"7901"},{name:"Онигирадзу с крабом",promo:"4360"},{name:"Филадельфия классическая",promo:"1203"},{name:"1000 бонусов",promo:"8888"},{name:"Сет 'Венеция'",promo:"0001"},{name:"Суперприз 100000 бонусов",promo:"7897"}];

const wheel=document.getElementById("wheel"),result=document.getElementById("result"),instruction=document.getElementById("instruction"),leverBall=document.getElementById("lever-ball"),message=document.getElementById("message"),countdown=document.getElementById("countdown");
const leverSound=document.getElementById("leverSound"),spinSound=document.getElementById("spinSound"),winSound=document.getElementById("winSound");

let spinning=false,pulling=false,startY=0;

const lastSpin = localStorage.getItem("lastSpinTime");
const now = new Date().getTime();

if (lastSpin && now - lastSpin < 86400000) {
    spinning = true;
    result.innerHTML = "Вы уже крутили сегодня. Приходите завтра!";
    showCountdown(86400000 - (now - lastSpin));
}

function showCountdown(ms) {
    countdown.style.display = "block";
    const interval = setInterval(() => {
        ms -= 1000;
        if (ms <= 0) {
            clearInterval(interval);
            countdown.innerHTML = "Можно крутить!";
            spinning = false;
            leverBall.style.cursor = "grab"; // Фикс
            return;
        }
        const h = Math.floor(ms / 3600000);
        const m = Math.floor((ms % 3600000) / 60000);
        const s = Math.floor((ms % 60000) / 1000);
        countdown.innerHTML = `Следующая попытка через ${h}ч ${m}м ${s}с`;
    }, 1000);
}

leverBall.onmousedown=e=>{if(!spinning){pulling=true;startY=e.clientY;leverBall.style.cursor="grabbing"}};
document.onmousemove=e=>{if(!pulling)return;let d=Math.max(0,Math.min(120,e.clientY-startY));leverBall.style.transform=`translateY(${d}px)`};
document.onmouseup=()=>{
    if(!pulling) return;
    pulling = false;
    leverBall.style.cursor = "grab";
    leverBall.style.transform = "translateY(0px)";

    if(spinning) return;
    
    leverSound.play();
    spinning = true;

    localStorage.setItem("lastSpinTime", new Date().getTime());

    const selectedIndex = Math.floor(Math.random()*prizes.length);
    const win = prizes[selectedIndex];
    const sectorSize = 360/prizes.length;
    const targetAngle = 360*10+(360-selectedIndex*sectorSize-sectorSize/2);

    spinSound.play();
    wheel.style.transform=`rotate(${targetAngle}deg)`;

    setTimeout(()=>{
        spinSound.pause();
        spinSound.currentTime=0;
        result.innerHTML="🎉 Вы выиграли: "+win.name+" — Промо: "+win.promo;
        winSound.play();
        showMessage(win.name=="Суперприз 100000 бонусов"?"СУПЕРПРИЗ!":"ВЫ ВЫИГРАЛИ!");
        instruction.style.display="block";
        for(let i=0;i<200;i++)createFirework();
        setTimeout(()=>{message.style.display="none"},5000);
        showCountdown(86400000);
    },5200);
};

function createFirework(){let c=document.createElement("div");c.className="confetti";c.style.left=window.innerWidth/2+"px";c.style.top=window.innerHeight/2+"px";c.style.setProperty('--x',(Math.random()*600-300)+"px");c.style.setProperty('--y',(Math.random()*600-300)+"px");c.style.background="hsl("+Math.random()*360+",100%,50%)";document.body.appendChild(c);setTimeout(()=>c.remove(),3000)}
function showMessage(t){message.textContent=t;message.style.display="block"}
</script>
</body>
</html>
